services:
  - type: web
    name: random-dice2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: random-dice2-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: random-dice2-db
    plan: free
